name: wordraid
description: "Word Raid: Daily Rescue - A fast, addictive word puzzle game."
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Ads & Monetization
  google_mobile_ads: ^5.1.0
  
  # Game Services
  games_services: ^4.0.0
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_analytics: ^11.2.0
  
  # Utilities
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # UI & Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  
  # Audio & Haptics
  audioplayers: ^6.0.0
  vibration: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/dictionary/
    - assets/animations/
    - assets/audio/
